##
## Kamailio SIP Proxy + Registrar
## claude-phone — self-hosted replacement for 3CX Cloud
##
## Site-specific values (EXTERNAL_IP, SIP_DOMAIN, etc.) are injected by
## docker-entrypoint.sh into kamailio-local.cfg before Kamailio starts.
##
## Call flow:
##   Softphone → REGISTER → Kamailio (registers in usrloc / SQLite)
##   Softphone → INVITE 9000 → Kamailio → drachtio:5070 → FreeSWITCH → Claude
##   Softphone → INVITE alice → Kamailio → alice's registered contact
##

#!include_file "/etc/kamailio/kamailio-local.cfg"

## =========================================================================
## Global Parameters
## =========================================================================
debug=2
log_stderror=yes
log_facility=LOG_LOCAL0
fork=yes
children=4

## Listen on all interfaces — host networking means this binds to the real NIC
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

## Tell Kamailio which hostnames/IPs refer to itself (used in loose_route etc.)
alias="SIP_DOMAIN"
alias="EXTERNAL_IP"

## =========================================================================
## Modules
## =========================================================================
mpath="KAM_MPATH"

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "db_sqlite.so"
loadmodule "nathelper.so"

## =========================================================================
## Module Parameters
## =========================================================================

# -- tm (transaction manager) --
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer",     30000)
modparam("tm", "fr_inv_timer", 120000)

# -- rr (record-route) --
modparam("rr", "enable_full_lr", 0)
modparam("rr", "append_fromtag", 0)

# -- usrloc: store location in SQLite, persist across restarts --
modparam("usrloc", "db_url",  "sqlite:///etc/kamailio/subscriber.db")
modparam("usrloc", "db_mode", 2)

# -- auth_db: authenticate REGISTERs against subscriber table --
modparam("auth_db", "db_url",          "sqlite:///etc/kamailio/subscriber.db")
modparam("auth_db", "calculate_ha1",   1)
modparam("auth_db", "password_column", "password")
modparam("auth_db", "user_column",     "username")
modparam("auth_db", "domain_column",   "domain")
modparam("auth_db", "load_credentials","")

# -- registrar --
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires",      3600)
modparam("registrar", "min_expires",      60)

# -- nathelper: keepalive pings for NATed clients --
modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only",  1)
modparam("nathelper", "sipping_bflag",    7)
modparam("nathelper", "set_rport",        1)

## =========================================================================
## Main Request Route
## =========================================================================
request_route {

    # Per-request sanity checks and anti-loop protection
    route(REQINIT);

    # NAT detection — fix Contact headers for clients behind NAT
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            fix_nated_contact();
        }
        setbflag(7);
    }

    # Softphones register with Kamailio (replaces 3CX registration)
    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    # Retransmission handling
    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # In-dialog requests (BYE, re-INVITE, UPDATE, …)
    route(WITHINDLG);

    # Add Record-Route header so all in-dialog requests pass through here
    if (!is_method("REGISTER|MESSAGE")) {
        record_route();
    }

    # Route new call legs
    if (is_method("INVITE")) {
        route(INVITE_HANDLER);
        exit;
    }

    # Anything else we haven't handled — relay statefully
    route(RELAY);
}

## =========================================================================
## REQINIT — sanity checks and health probes
## =========================================================================
route[REQINIT] {

    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # OPTIONS to ourselves → quick 200 OK (used as a health probe by docker)
    if (is_method("OPTIONS") && uri==myself) {
        sl_send_reply("200", "Kamailio OK");
        exit;
    }

    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "Sanity check failed from $si:$sp\n");
        exit;
    }
}

## =========================================================================
## REGISTRAR — authenticate and save softphone location
## =========================================================================
route[REGISTRAR] {

    # Digest authentication against subscriber table
    if (!www_authenticate("KAM_REALM", "subscriber")) {
        www_challenge("KAM_REALM", "0");
        exit;
    }

    # Ensure the authenticated username matches the To header AOR
    if (!check_to()) {
        sl_send_reply("403", "Forbidden - Auth ID mismatch");
        exit;
    }

    # Save contact in usrloc (200 OK sent automatically by save())
    if (!save("location")) {
        sl_send_reply("400", "Bad Request - Could not save location");
        exit;
    }
}

## =========================================================================
## WITHINDLG — route in-dialog requests (BYE, re-INVITE, etc.)
## =========================================================================
route[WITHINDLG] {

    if (!has_totag()) return;

    # Route headers already set — follow them
    if (loose_route()) {
        route(RELAY);
        exit;
    }

    if (is_method("SUBSCRIBE|NOTIFY|PUBLISH")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # ACK after non-2xx — drop silently
    if (is_method("ACK")) {
        exit;
    }

    sl_send_reply("404", "Not here");
    exit;
}

## =========================================================================
## INVITE_HANDLER — route new calls
## =========================================================================
route[INVITE_HANDLER] {

    # Trust calls arriving from localhost (voice-app → drachtio → here)
    # so outbound calls initiated by claude-phone don't require auth
    if (src_ip == 127.0.0.1) {
        if (lookup("location")) {
            route(RELAY);
        } else {
            sl_send_reply("404", "Not Found");
        }
        exit;
    }

    # Try registered local softphones first (softphone-to-softphone calls)
    if (lookup("location")) {
        route(RELAY);
        exit;
    }

    # Check for AI extensions (default: 9000–9999 four-digit)
    # Change AI_EXT_REGEX in kamailio-local.cfg to match your extensions
    if ($rU =~ "AI_EXT_REGEX") {
        route(FORWARD_TO_DRACHTIO);
        exit;
    }

    sl_send_reply("404", "Not Found");
    exit;
}

## =========================================================================
## FORWARD_TO_DRACHTIO — hand the call to the voice-app SIP handler
## =========================================================================
route[FORWARD_TO_DRACHTIO] {

    xlog("L_INFO", "[$ci] AI extension $rU → drachtio @ DRACHTIO_ADDR\n");

    # Rewrite Request-URI to point at drachtio (port 5070)
    $ru = "sip:" + $rU + "@DRACHTIO_ADDR";

    # Optional marker so voice-app logs can confirm Kamailio routing
    append_hf("X-KAM-Routed: yes\r\n");

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

## =========================================================================
## RELAY — stateful relay (used for in-dialog and softphone-to-softphone)
## =========================================================================
route[RELAY] {

    # Force rport + fix contacts for NATed legs
    if (is_method("INVITE|SUBSCRIBE")) {
        force_rport();
        if (nat_uac_test("19")) {
            fix_nated_contact();
        }
    }

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

## =========================================================================
## Reply route — fix NATed Contact in 200 OKs
## =========================================================================
onreply_route {
    if (nat_uac_test("1")) {
        fix_nated_contact();
    }
}
